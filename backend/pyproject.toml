[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchpilot-x-backend"
version = "0.1.0"
description = "PatchPilot X Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
